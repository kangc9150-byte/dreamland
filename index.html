<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物纪念 - 彩虹桥的梦幻之旅</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }
        
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            font-size: 14px;
            color: #333;
            max-width: 300px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }
        
        .info-panel h2 {
            margin-bottom: 10px;
            color: #667eea;
        }
        
        .info-panel p {
            margin: 5px 0;
            line-height: 1.6;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }
        
        .controls p {
            font-size: 13px;
            color: #666;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="info-panel">
        <h2>🌈 彩虹桥之旅</h2>
        <p><strong>宠物纪念主题场景</strong></p>
        <p>观看可爱的小狐狸在彩虹桥上奔跑，前往梦幻城堡。</p>
        <p style="margin-top: 15px; color: #999; font-size: 12px;">💡 提示：滚动鼠标轮放大/缩小视图</p>
    </div>
    
    <div class="controls">
        <p>🎮 交互提示</p>
        <p>🖱️ 滚轮：缩放视图</p>
        <p>🎥 相机自动环绕</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>

    <script>
        // ==================== 场景初始化 ====================
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0xe0a0ff, 1);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;
        
        // 相机初始位置
        camera.position.set(0, 10, 20);
        camera.lookAt(0, 5, 0);
        
        // ==================== 天空背景 ====================
        const skyGeometry = new THREE.SphereGeometry(500, 32, 32);
        const skyCanvas = document.createElement('canvas');
        skyCanvas.width = 512;
        skyCanvas.height = 512;
        const skyCtx = skyCanvas.getContext('2d');
        
        const gradient = skyCtx.createLinearGradient(0, 0, 0, skyCanvas.height);
        gradient.addColorStop(0, '#e0a0ff');
        gradient.addColorStop(0.5, '#ffb366');
        gradient.addColorStop(1, '#fffacd');
        skyCtx.fillStyle = gradient;
        skyCtx.fillRect(0, 0, skyCanvas.width, skyCanvas.height);
        
        const skyTexture = new THREE.CanvasTexture(skyCanvas);
        const skyMaterial = new THREE.MeshBasicMaterial({ map: skyTexture });
        const skyMesh = new THREE.Mesh(skyGeometry, skyMaterial);
        scene.add(skyMesh);
        
        // ==================== 彩虹桥创建 ====================
        function createRainbowBridge() {
            const group = new THREE.Group();
            
            // 创建彩虹渐变纹理
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            const colors = ['#FF0000', '#FF7F00', '#FFFF00', '#00FF00', '#0000FF', '#4B0082', '#9400D3'];
            const colorWidth = canvas.width / (colors.length - 1);
            
            for (let i = 0; i < colors.length - 1; i++) {
                const gradient = ctx.createLinearGradient(i * colorWidth, 0, (i + 1) * colorWidth, 0);
                gradient.addColorStop(0, colors[i]);
                gradient.addColorStop(1, colors[i + 1]);
                ctx.fillStyle = gradient;
                ctx.fillRect(i * colorWidth, 0, colorWidth, canvas.height);
            }
            
            const rainbowTexture = new THREE.CanvasTexture(canvas);
            
            // 创建拱桥
            for (let i = 0; i < 100; i++) {
                const t = i / 100;
                const x = -50 + t * 100;
                const z = Math.sin(t * Math.PI) * 50;
                const y = t * 20;
                
                const segmentGeometry = new THREE.BoxGeometry(1, 2, 1);
                const segmentMaterial = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(t, 0.8, 0.5),
                    roughness: 0.4,
                    metalness: 0.3
                });
                
                const segment = new THREE.Mesh(segmentGeometry, segmentMaterial);
                segment.position.set(x, y, z);
                segment.castShadow = true;
                segment.receiveShadow = true;
                group.add(segment);
            }
            
            return group;
        }
        
        const rainbowBridge = createRainbowBridge();
        scene.add(rainbowBridge);
        
        // ==================== 宠物（狐狸）创建 ====================
        function createFox() {
            const group = new THREE.Group();
            
            // 身体
            const bodyGeometry = new THREE.CapsuleGeometry(1, 3);
            const bodyMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xFF8C42,
                roughness: 0.8
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.castShadow = true;
            group.add(body);
            
            // 头
            const headGeometry = new THREE.SphereGeometry(0.8, 32, 32);
            const head = new THREE.Mesh(headGeometry, bodyMaterial);
            head.position.y = 2;
            head.castShadow = true;
            group.add(head);
            
            // 左眼
            const eyeGeometry = new THREE.SphereGeometry(0.2, 16, 16);
            const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });
            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(-0.3, 2.3, 0.7);
            group.add(leftEye);
            
            // 右眼
            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(0.3, 2.3, 0.7);
            group.add(rightEye);
            
            // 左耳
            const earGeometry = new THREE.ConeGeometry(0.4, 1.2, 8);
            const leftEar = new THREE.Mesh(earGeometry, bodyMaterial);
            leftEar.position.set(-0.5, 2.7, 0);
            leftEar.castShadow = true;
            group.add(leftEar);
            
            // 右耳
            const rightEar = new THREE.Mesh(earGeometry, bodyMaterial);
            rightEar.position.set(0.5, 2.7, 0);
            rightEar.castShadow = true;
            group.add(rightEar);
            
            // 尾巴
            const tailGeometry = new THREE.CylinderGeometry(0.3, 0.2, 2, 8);
            const tail = new THREE.Mesh(tailGeometry, bodyMaterial);
            tail.position.set(0, 0, -1.8);
            tail.rotation.z = 0.3;
            tail.castShadow = true;
            group.add(tail);
            
            // 前腿
            const legGeometry = new THREE.CylinderGeometry(0.3, 0.3, 1.5, 8);
            const leftLeg = new THREE.Mesh(legGeometry, bodyMaterial);
            leftLeg.position.set(-0.5, -1, 0.3);
            leftLeg.castShadow = true;
            group.add(leftLeg);
            
            const rightLeg = new THREE.Mesh(legGeometry, bodyMaterial);
            rightLeg.position.set(0.5, -1, 0.3);
            rightLeg.castShadow = true;
            group.add(rightLeg);
            
            return group;
        }
        
        const fox = createFox();
        scene.add(fox);
        
        // ==================== 城堡创建 ====================
        function createCastle() {
            const group = new THREE.Group();
            const castleX = 45;
            const castleY = 25;
            const castleZ = 45;
            
            // 主塔
            const mainTowerGeometry = new THREE.CylinderGeometry(4, 4, 15, 16);
            const stoneMaterial = new THREE.MeshStandardMaterial({
                color: 0x8B7355,
                roughness: 0.9
            });
            const mainTower = new THREE.Mesh(mainTowerGeometry, stoneMaterial);
            mainTower.position.set(castleX, castleY, castleZ);
            mainTower.castShadow = true;
            mainTower.receiveShadow = true;
            group.add(mainTower);
            
            // 主塔顶部
            const roofGeometry = new THREE.ConeGeometry(5, 6, 16);
            const roofMaterial = new THREE.MeshStandardMaterial({ color: 0xFF6B9D });
            const mainRoof = new THREE.Mesh(roofGeometry, roofMaterial);
            mainRoof.position.set(castleX, castleY + 10.5, castleZ);
            mainRoof.castShadow = true;
            group.add(mainRoof);
            
            // 副塔
            const towerConfigs = [
                { x: -3, z: -3, h: 10, r: 3 },
                { x: 3, z: -3, h: 10, r: 3 },
                { x: -3, z: 3, h: 10, r: 3 },
                { x: 3, z: 3, h: 10, r: 3 }
            ];
            
            towerConfigs.forEach(config => {
                const towerGeo = new THREE.CylinderGeometry(config.r, config.r, config.h, 16);
                const tower = new THREE.Mesh(towerGeo, stoneMaterial);
                tower.position.set(castleX + config.x, castleY - 2.5, castleZ + config.z);
                tower.castShadow = true;
                tower.receiveShadow = true;
                group.add(tower);
                
                const smallRoof = new THREE.Mesh(
                    new THREE.ConeGeometry(config.r + 0.5, 4, 16),
                    roofMaterial
                );
                smallRoof.position.set(castleX + config.x, castleY - 2.5 + config.h / 2 + 2, castleZ + config.z);
                smallRoof.castShadow = true;
                group.add(smallRoof);
            });
            
            // 城墙
            const wallGeometry = new THREE.BoxGeometry(20, 8, 15);
            const wall = new THREE.Mesh(wallGeometry, stoneMaterial);
            wall.position.set(castleX, castleY - 5, castleZ);
            wall.castShadow = true;
            wall.receiveShadow = true;
            group.add(wall);
            
            // 窗户
            for (let i = 0; i < 5; i++) {
                const windowGeometry = new THREE.BoxGeometry(1.2, 1.2, 0.2);
                const windowMaterial = new THREE.MeshStandardMaterial({
                    color: 0xFFD700,
                    emissive: 0xFFD700,
                    emissiveIntensity: 0.5
                });
                const window_ = new THREE.Mesh(windowGeometry, windowMaterial);
                window_.position.set(castleX - 8 + i * 4, castleY - 1, castleZ - 7.8);
                window_.castShadow = true;
                group.add(window_);
            }
            
            return group;
        }
        
        const castle = createCastle();
        scene.add(castle);
        
        // ==================== 花园创建 ====================
        function createGarden() {
            const group = new THREE.Group();
            const gardenX = 45;
            const gardenY = 0;
            const gardenZ = 45;
            
            // 树木
            const treePositions = [
                { x: -20, z: -15, s: 4 },
                { x: 20, z: -15, s: 4 },
                { x: -15, z: 20, s: 3.5 },
                { x: 15, z: 20, s: 3.5 }
            ];
            
            const treeMaterial = new THREE.MeshStandardMaterial({
                color: 0x228B22,
                roughness: 0.8
            });
            
            treePositions.forEach(pos => {
                const treeGeometry = new THREE.SphereGeometry(pos.s, 16, 16);
                const tree = new THREE.Mesh(treeGeometry, treeMaterial);
                tree.position.set(gardenX + pos.x, gardenY + pos.s / 2, gardenZ + pos.z);
                tree.castShadow = true;
                tree.receiveShadow = true;
                group.add(tree);
            });
            
            // 花朵
            const flowerColors = [0xFF1493, 0xFF69B4, 0xFFB6C1, 0xFFFF00, 0xFF6347, 0x9370DB];
            for (let i = 0; i < 30; i++) {
                const flowerGeometry = new THREE.SphereGeometry(0.5, 8, 8);
                const flowerMaterial = new THREE.MeshStandardMaterial({
                    color: flowerColors[Math.floor(Math.random() * flowerColors.length)],
                    emissive: flowerColors[Math.floor(Math.random() * flowerColors.length)],
                    emissiveIntensity: 0.3
                });
                const flower = new THREE.Mesh(flowerGeometry, flowerMaterial);
                flower.position.set(
                    gardenX + (Math.random() - 0.5) * 50,
                    gardenY + 0.5,
                    gardenZ + (Math.random() - 0.5) * 50
                );
                flower.castShadow = true;
                group.add(flower);
            }
            
            return group;
        }
        
        const garden = createGarden();
        scene.add(garden);
        
        // ==================== 灯光系统 ====================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(30, 40, 30);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.far = 200;
        directionalLight.shadow.camera.left = -100;
        directionalLight.shadow.camera.right = 100;
        directionalLight.shadow.camera.top = 100;
        directionalLight.shadow.camera.bottom = -100;
        scene.add(directionalLight);
        
        const bridgeLight = new THREE.PointLight(0xFFFFFF, 1, 200);
        bridgeLight.position.set(0, 15, 25);
        scene.add(bridgeLight);
        
        const castleLight = new THREE.PointLight(0xFFD700, 1.5, 150);
        castleLight.position.set(45, 30, 45);
        scene.add(castleLight);
        
        // ==================== 粒子系统 ====================
        function createParticles() {
            const particleCount = 100;
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const velocities = [];
            
            for (let i = 0; i < particleCount; i++) {
                positions.push(
                    (Math.random() - 0.5) * 150,
                    Math.random() * 100,
                    (Math.random() - 0.5) * 150
                );
                velocities.push(
                    (Math.random() - 0.5) * 0.02,
                    -0.01,
                    (Math.random() - 0.5) * 0.02
                );
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
            
            const material = new THREE.PointsMaterial({
                color: 0xFFD700,
                size: 0.5,
                emissive: 0xFFD700,
                emissiveIntensity: 0.8
            });
            
            const particles = new THREE.Points(geometry, material);
            particles.velocities = velocities;
            return particles;
        }
        
        const particles = createParticles();
        scene.add(particles);
        
        // ==================== 动画循环 ====================
        let time = 0;
        const bridgeCurvePoints = [];
        for (let i = 0; i <= 100; i++) {
            const t = i / 100;
            bridgeCurvePoints.push({
                x: -50 + t * 100,
                y: t * 20,
                z: Math.sin(t * Math.PI) * 50
            });
        }
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            
            // 更新狐狸位置
            const t = (time * 0.2) % 1;
            const idx = Math.floor(t * 100);
            const point = bridgeCurvePoints[Math.min(idx, 99)];
            
            fox.position.set(point.x, point.y, point.z);
            fox.rotation.y += 0.02;
            
            // 弹跳动画
            const bounceHeight = Math.sin(time * 10) * 0.3;
            fox.position.y += bounceHeight;
            
            // 更新粒子
            const posArray = particles.geometry.attributes.position.array;
            for (let i = 0; i < posArray.length; i += 3) {
                posArray[i] += particles.velocities[i];
                posArray[i + 1] += particles.velocities[i + 1];
                posArray[i + 2] += particles.velocities[i + 2];
                
                if (posArray[i + 1] < 0) posArray[i + 1] = 100;
            }
            particles.geometry.attributes.position.needsUpdate = true;
            
            // 相机环绕
            const radius = 25;
            const angle = time * 0.3;
            camera.position.x = fox.position.x + Math.cos(angle) * radius;
            camera.position.y = fox.position.y + 8;
            camera.position.z = fox.position.z + Math.sin(angle) * radius;
            camera.lookAt(fox.position.x, fox.position.y + 2, fox.position.z);
            
            renderer.render(scene, camera);
        }
        
        // 鼠标滚轮缩放
        window.addEventListener('wheel', (event) => {
            event.preventDefault();
            const direction = camera.position.clone().normalize();
            if (event.deltaY > 0) {
                camera.position.addScaledVector(direction, 1);
            } else {
                camera.position.addScaledVector(direction, -1);
            }
        }, { passive: false });
        
        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        animate();
    </script>
</body>
</html>
